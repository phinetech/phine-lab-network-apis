<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>phine-lab Network APIs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #fafafa; }
        .denied-banner {
            padding: 20px;
            margin: 40px auto;
            max-width: 800px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
    const allowedPrefixes = [
        "https://raw.githubusercontent.com/phinetech/",
        "https://phinetech.github.io/"
    ];

    function isUrlAllowed(url) {
        return allowedPrefixes.some(prefix => url.startsWith(prefix));
    }

    async function initSwagger() {
        const urlParams = new URLSearchParams(window.location.search);
        const customUrl = urlParams.get('url');

        let config = {
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout"
        };

        if (customUrl) {
            if (!isUrlAllowed(customUrl)) {
                document.getElementById('swagger-ui').innerHTML = `
            <div class="denied-banner">
              <h2>Access Denied</h2>
              <p>Only URLs from the <strong>phinetech</strong> organization are permitted.</p>
              <p>Blocked URL: <code>${customUrl}</code></p>
            </div>
          `;
                return;
            }
            config.url = customUrl;
        }

        else {
            let urls = [
                {
                    url: "https://raw.githubusercontent.com/phinetech/phine-lab-network-apis/main/API_definitions/quality-on-demand.yaml",
                    name: "Quality On Demand"
                }
            ];

            try {
                const response = await fetch("https://api.github.com/repos/phinetech/phine-lab-network-apis/git/trees/main?recursive=1");
                if (response.ok) {
                    const treeData = await response.json();
                    const discovered = treeData.tree
                        .filter(item => item.type === "blob" && item.path.startsWith("API_definitions/") && item.path.endsWith(".yaml"))
                        .map(file => {
                            const fileName = file.path.split('/').pop().replace(/\.yaml$/, '');
                            const title = fileName.replace(/[-_]/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
                            return {
                                url: `https://raw.githubusercontent.com/phinetech/phine-lab-network-apis/main/${file.path}`,
                                name: title
                            };
                        });

                    if (discovered.length > 0) urls = discovered;
                }
            } catch (err) {
                console.warn("GitHub API auto-discovery failed, using default fallback.", err);
            }

            config.urls = urls;
            config["urls.primaryName"] = urls[0]?.name;
        }

        window.ui = SwaggerUIBundle(config);
    }

    window.onload = initSwagger;
</script>
</body>
</html>
