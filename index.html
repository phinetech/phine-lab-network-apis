<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>phine-lab Network APIs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #fafafa; }
    </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
    async function initSwagger() {
        // Fallback raw URL if GitHub API fails
        let urls = [
            {
                url: "https://raw.githubusercontent.com/phinetech/phine-lab-network-apis/main/API_definitions/quality-on-demand.yaml",
                name: "Quality On Demand"
            }
        ];

        try {
            // Auto-discover all .yaml files in the API_definitions/ folder
            const response = await fetch("https://api.github.com/repos/phinetech/phine-lab-network-apis/git/trees/main?recursive=1");
            if (response.ok) {
                const treeData = await response.json();

                const discovered = treeData.tree
                    .filter(item => item.type === "blob" && item.path.startsWith("API_definitions/") && item.path.endsWith(".yaml"))
                    .map(file => {
                        const fileName = file.path.split('/').pop().replace(/\.yaml$/, '');
                        const title = fileName.replace(/[-_]/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
                        return {
                            url: `https://raw.githubusercontent.com/phinetech/phine-lab-network-apis/main/${file.path}`,
                            name: title
                        };
                    });

                if (discovered.length > 0) urls = discovered;
            }
        } catch (err) {
            console.warn("GitHub API auto-discovery failed, using default fallback.", err);
        }

        window.ui = SwaggerUIBundle({
            urls: urls,
            "urls.primaryName": urls[0]?.name,
            dom_id: '#swagger-ui',
            deepLinking: true,
            queryConfigEnabled: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout",

            // Enforce allowlist to block unauthorized external specs
            requestInterceptor: (req) => {
                const allowedPrefixes = [
                    "https://raw.githubusercontent.com/phinetech/",
                    "https://phinetech.github.io/",
                    "https://unpkg.com/",
                    "./",
                    "/"
                ];

                const isAllowed = allowedPrefixes.some(prefix => req.url.startsWith(prefix));

                if (!isAllowed) {
                    alert("Access Denied: Only raw links from the 'phinetech' organization are allowed.");
                    throw new Error("Blocked request to unauthorized URL: " + req.url);
                }

                return req;
            }
        });
    }

    window.onload = initSwagger;
</script>
</body>
</html>
